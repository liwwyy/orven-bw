name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          version, mc = props['mod_version'], props['minecraft_version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('mod_version must be x.x.x')
          tag = f'v{version}'
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != tag:
              raise SystemExit(f'Tag must match gradle.properties: {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\njar=orven-bw-Ornithe-{version}+mc{mc}.jar\n')
          PY
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - name: Test click analysis and viewer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check scripts/click_debug/viewer.js
          node scripts/test_click_debug_viewer.js
      - name: Prepare release files
        env:
          JAR: ${{ steps.version.outputs.jar }}
        run: |
          test -f "build/libs/$JAR"
          mkdir -p release
          cp "build/libs/$JAR" release/
          cd release
          sha256sum "$JAR" > "$JAR.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-jar
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.version.outputs.jar }}
          COMMIT: ${{ github.sha }}
        run: python3 scripts/publish_release.py
